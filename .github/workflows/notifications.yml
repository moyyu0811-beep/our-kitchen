name: Scheduled Push Notifications

on:
  schedule:
    # 8:30 AM EST corresponds to 12:30 PM UTC
    - cron: '30 12 * * *'
    # 8:30 PM EST corresponds to 12:30 AM UTC (next day)
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run Morning Notifications
        if: github.event.schedule == '30 12 * * *'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sendNotifications.js --morning

      - name: Run Evening Notifications
        if: github.event.schedule == '30 0 * * *'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sendNotifications.js --evening

      - name: Run Manual Notifications
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/sendNotifications.js --morning
